      Mom:
        Lipidome: []
        Metabolome: []
      Newborn:
        Lipidome: []
        Metabolome: []
    Zambia:
      Newborn: 
        Lipidome: [
          # Administrative / technical identifiers
          # SGA
          "getational_age_estimate ", "birth_weight_g", "sex",
          # Identifiers / provenance
          "new_id", "Study_ID", "NSO_Accession", "PKG_SentOn", "PKG_ReceivedOn",
          "EarliestResult_DT", "LatestResult_DT", "collect_final", "bdate_final",
          "YYYY_MM", "Facility", "Additive",  # date bucket (can leak temporal bias)
          # Timing / duration fields
          "aoc_hrs", 
          "collection_to_shipped", "shipped_to_receipt",
          "receipt_to_earliest_result", "receipt_to_latest_result",
          "collection_to_earliest_result", "collection_to_latest_result",
          
          # Screening categorical results (not raw metabolite values)
          "Latest HGB Result", "Latest TREC Result", "HGB", "TREC2", #"TREC",
          "Screen_Positive_", "application_method", "Sampling_Technique",
          
          # Genetic mutation categorical fields (not metabolite measures)
          "CFTR_Mutation_1", "CFTR_Mutation_2", "Intron_8_Polythymidine_Tract_5T",
          
          # Additional hemoglobin breakdown fields (categorical results, not metabolites)
          #"HGB___FAST", "HGB___F1", "HGB___F", "HGB___F_F1", "HGB___A",
          #"HGB___FAST_F1", "HGB___Other",
          
          # Quality flag
          "flag 0=fresh, 1=frozen, shipped frozen, 2=frozen, shipped fresh",
          
          # Demographics of the newborn
          "birth_weight_g", "sex", "getational_age_estimate", "estimated_delivery_date",
          "GA_at_ultrasound_weeks", "ultrasound_date", "birth_location", "feed_type",
          "transfusion", "multiple_birth", "birth_order", "estimated_birth_percentile",
          "estimated_SGA10", "estimated_SGA3", "Mode_delivery",
          "apgar_1", "apgar_5", "apgar_10",
          
          # Maternal characteristics
          "maternal_age_delivery", "prepregnancy_bmi", "parity", "gravity",
          "smoking", "alcohol", "diabetes_baseline", "diabetes",
          "hypertension", "gest_hypertension", "preeclampsia",
          "antiretroviral_therapy",
          ] 


