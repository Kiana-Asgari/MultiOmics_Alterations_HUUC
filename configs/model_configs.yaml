      # Todo: zimbabwe still missing data
      Annotation: 
        Mom: "variable_info_mom_metabolom_kenya.csv"
        Newborn: "" # not available

    Zimbabwe:
      Questionnaire: "Zimbabwe/ZimbabweHouseholdData.csv"
      Metabolome: "Zimbabwe/MetabolomeMoms_New.csv"
      
    Bangladesh:
      Questionnaire: "Bangladesh/BangladeshHouseholdData.csv"
      Metabolome: "Bangladesh/MetabolomeMoms_New.csv"


    Zambia:
